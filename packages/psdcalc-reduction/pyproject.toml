[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "psdcalc-reduction"
version = "0.2.0"
description = "Replayable PyPSA network reduction contracts and workflows"
requires-python = ">=3.11,<3.14"
license = "MPL-2.0"
dependencies = [
  "pypsa>=1.2,<1.3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "pandas>=2.2,<4",
  "pyarrow>=20,<24",
  "networkx>=3.2,<5",
  "scikit-learn>=1.5,<2",
]

[project.scripts]
psdcalc-reduction = "psdcalc.reduction.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "hypothesis>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["psdcalc*"]

[tool.setuptools.package-data]
"psdcalc.reduction.resources" = ["*.json", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
